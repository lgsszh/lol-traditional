name: Deploy public website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static website
        run: npm run build:pages
        env:
          RIFT_STATIC_EXPORT: "1"
          # GitHub 项目站点的访问路径必须与仓库名一致。
          NEXT_PUBLIC_BASE_PATH: /lol-traditional
          NEXT_PUBLIC_SITE_URL: https://lgsszh.github.io/lol-traditional/
      - name: Verify static export uses the repository base path
        run: |
          test -f out/index.html
          grep -q "/lol-traditional/_next/" out/index.html
          grep -q "/lol-traditional/classic-cache/" out/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
